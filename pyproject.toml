[project]
name = "wine-science"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "selectolax>=0.4.13,<1.0",
    "sqlglot>=30.23.0",
    "stop-words>=2025.11.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
